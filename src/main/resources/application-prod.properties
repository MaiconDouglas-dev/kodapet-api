# URL de conexão com o banco Oracle (Ajuste o IP, Porta e o SID/Service Name do seu cluster)
spring.datasource.url=jdbc:oracle:thin:@localhost:1521:ORCL
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver
spring.datasource.username=SEU_USUARIO_ORACLE
spring.datasource.password=SUA_SENHA_ORACLE

# Dialeto específico para otimizar os recursos do Oracle Database
spring.jpa.database-platform=org.hibernate.dialect.OracleDialect

# Estratégia de geração do banco para Produção: 'validate' apenas confere se as tabelas
# criadas no Java batem exatamente com as tabelas já existentes no banco físico (MER).
# Isso evita que o Hibernate altere ou apague dados de produção por acidente.
spring.jpa.hibernate.ddl-auto=validate

# Logs de auditoria de queries para o ambiente de homologação
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true